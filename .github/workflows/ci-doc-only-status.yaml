name: CI - Doc-Only Status

# pull_request_target runs in the base repo context so the token has statuses: write
# even for fork PRs. We never checkout or execute PR code here — safe to use.
on:
  pull_request_target:
    branches:
      - main
      - dev

permissions:
  statuses: write
  pull-requests: read

jobs:
  doc-only-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base repo (not PR code) for paths-filter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!LICENSE'
              - '!OWNERS'
              - '!PROJECT'

      - name: Log doc-only skip
        if: steps.filter.outputs.code != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Kind smoke/full and OpenShift tests all use GitHub Actions check runs now.
            // GitHub treats skipped jobs as passing for branch protection, so no commit
            // statuses need to be posted here for doc-only PRs.
            console.log('Doc-only PR detected — Kind and OpenShift checks will be skipped (passes branch protection automatically).');
